<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgdel" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#1a1340"/>
      <stop offset="100%" stop-color="#0c0820"/>
    </linearGradient>
    <!-- dolphin / consensus arc gradient -->
    <linearGradient id="dolgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#9F8CF5"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <clipPath id="hexdel">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgdel)"/>

  <g clip-path="url(#hexdel)">

    <!-- faint grid -->
    <line x1="45" y1="210" x2="455" y2="210" stroke="#2a2060" stroke-width="0.4" opacity="0.4"/>
    <line x1="45" y1="270" x2="455" y2="270" stroke="#2a2060" stroke-width="0.4" opacity="0.4"/>
    <line x1="45" y1="330" x2="455" y2="330" stroke="#2a2060" stroke-width="0.4" opacity="0.4"/>
    <line x1="150" y1="145" x2="150" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.3"/>
    <line x1="250" y1="145" x2="250" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.3"/>
    <line x1="350" y1="145" x2="350" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.3"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- DELPHI CONSENSUS — three round distributions converging -->
    <!-- Round 1 wide & flat, Round 2 narrower, Round 3 a tight  -->
    <!-- consensus peak. Shown as stacked density curves.         -->
    <!-- ══════════════════════════════════════════════════════ -->

    <!-- Round 1 — wide, low, faint (disagreement) -->
    <path d="M 95,330 C 150,322 180,312 250,312 C 320,312 350,322 405,330"
      fill="none" stroke="#5B4A9E" stroke-width="2.4" opacity="0.5" stroke-linecap="round"/>
    <!-- Round 2 — medium -->
    <path d="M 110,330 C 170,326 210,286 250,286 C 290,286 330,326 390,330"
      fill="none" stroke="#7C3AED" stroke-width="2.8" opacity="0.7" stroke-linecap="round"/>
    <!-- Round 3 — tight consensus peak (bright) -->
    <path d="M 150,330 C 205,328 232,236 250,236 C 268,236 295,328 350,330"
      fill="none" stroke="#B9A6FF" stroke-width="3.4" opacity="0.98" stroke-linecap="round"/>

    <!-- baseline axis -->
    <line x1="90" y1="330" x2="410" y2="330" stroke="#4a3a8a" stroke-width="1" opacity="0.6"/>

    <!-- consensus centre marker — vertical median line + dot -->
    <line x1="250" y1="236" x2="250" y2="330" stroke="#B9A6FF" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
    <circle cx="250" cy="236" r="5" fill="#E9E2FF"/>
    <circle cx="250" cy="236" r="9" fill="#B9A6FF" opacity="0.25"/>

    <!-- quartile ticks on the consensus curve (type-7 quartiles) -->
    <line x1="214" y1="326" x2="214" y2="336" stroke="#9F8CF5" stroke-width="1.6" opacity="0.7"/>
    <line x1="286" y1="326" x2="286" y2="336" stroke="#9F8CF5" stroke-width="1.6" opacity="0.7"/>

    <!-- rating dots scattering toward consensus (participants) -->
    <g fill="#C4B5F7">
      <circle cx="160" cy="316" r="2.4" opacity="0.5"/>
      <circle cx="195" cy="300" r="2.4" opacity="0.6"/>
      <circle cx="225" cy="268" r="2.6" opacity="0.8"/>
      <circle cx="250" cy="252" r="2.8" opacity="0.95"/>
      <circle cx="275" cy="268" r="2.6" opacity="0.8"/>
      <circle cx="305" cy="300" r="2.4" opacity="0.6"/>
      <circle cx="340" cy="316" r="2.4" opacity="0.5"/>
    </g>

    <!-- round labels -->
    <text font-family="monospace" font-size="8" fill="#7C6BC0" opacity="0.7" text-anchor="start" x="96" y="348">R1</text>
    <text font-family="monospace" font-size="8" fill="#9F8CF5" opacity="0.8" text-anchor="middle" x="250" y="348">R2</text>
    <text font-family="monospace" font-size="8" fill="#B9A6FF" opacity="0.9" text-anchor="end" x="404" y="348">R3 ✓</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- DOLPHIN — delphy→dolphin wordplay, leaping over the      -->
    <!-- consensus peak, top area. Minimal silhouette.           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- JUMPING DOLPHIN — traced from reference silhouette, leaping up-right -->
    <g transform="translate(152.0,97.7) scale(0.6323)">
      <g transform="translate(0.000000,292.000000) scale(0.100000,-0.100000)"
      fill="url(#dolgrad)" stroke="none">
