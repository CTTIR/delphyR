template:
  package: themakR
development:
  mode: auto
destination: site
reference:
  - title: Protocols and scales
    desc: Declare and validate the study protocol, its response scales and instrument items.
    contents:
      - new_protocol
      - validate_protocol
      - demo_protocol
      - new_scale
      - validate_response
      - validate_items
      - read_item_import
  - title: Offline analysis
    desc: Freeze a round, classify consensus, compare rounds and prepare disclosure-controlled feedback without a database.
    contents:
      - new_snapshot
      - demo_snapshot
      - analyse_round
      - classify_consensus
      - compare_rounds
      - prepare_feedback
      - validate_feedback
      - content_hash
  - title: Reproduction
    desc: Verify a research export and recompute its analysis from its files.
    contents:
      - reproduce_export
      - reproduce_study_export
  - title: Repository, identities and demonstration
    desc: Connect and migrate the PostgreSQL repository, resolve trusted identities and create synthetic studies.
    contents:
      - connect_repository
      - migrate_repository
      - new_authentication_config
      - authenticated_actor
      - provision_demo_principal
      - demo_actor
      - demo_study
  - title: Studies, protocol versions and staff
    desc: Create and complete studies, amend protocols and manage staff rights.
    contents:
      - create_study
      - list_studies
      - get_study_setup
      - complete_study
      - list_protocol_versions
      - amend_protocol
      - get_capabilities
      - set_capability
      - get_account_rights
      - register_staff_account
      - list_study_staff
  - title: Panel, imports and invitations
    desc: Maintain the pseudonymous panel, import contacts and issue account-bound invitations.
    contents:
      - add_panelist
      - list_panel
      - set_panel_group
      - withdraw_participation
      - preview_panel_import
      - import_panel
      - get_panel_import_receipt
      - new_invitation_token
      - invitation_code
      - parse_invitation_code
      - issue_panel_invitation
      - preview_panel_invitation
      - accept_panel_invitation
      - revoke_panel_invitation
      - register_invited_account
      - list_panel_invitations
  - title: Rounds, consent and responses
    desc: Prepare and open rounds, record consent, save revisions and submit.
    contents:
      - publish_consent
      - record_consent
      - prepare_round
      - get_round_instrument
      - get_round_readiness
      - enroll_panel
      - list_rounds
      - transition_round
      - change_round_deadline
      - list_enrollments
      - get_questionnaire
      - save_response
      - submit_round
  - title: Snapshots, analyses and feedback
    desc: Freeze closed rounds, persist analyses and release reviewed feedback.
    contents:
      - freeze_round
      - get_snapshot
      - run_analysis
      - get_analysis
      - create_feedback
      - get_feedback_candidate
      - release_feedback
      - release_feedback_correction
      - assign_feedback
      - get_feedback
      - list_released_feedback
      - record_item_decision
      - list_item_decisions
  - title: Qualitative sources and item lineage
    desc: Preserve originals, review redactions and summaries, code themes and record item provenance.
    contents:
      - record_qualitative_source
      - redact_qualitative_source
      - release_qualitative_edit
      - list_qualitative_reviews
      - list_released_edits
      - create_qualitative_theme
      - code_qualitative_source
      - link_item_source
      - record_item_lineage
      - get_qualitative_provenance
      - list_contribution_rounds
      - import_round_contributions
      - record_item_comparability
      - get_item_comparability
  - title: Campaigns and delivery
    desc: Approve message campaigns and resolve their delivery through a provider adapter.
    contents:
      - list_campaign_rounds
      - list_campaign_enrollments
      - prepare_campaign
      - preview_campaign
      - release_campaign
      - cancel_campaign
      - new_message_adapter
      - process_campaign_message
      - process_campaign_sink
      - list_uncertain_deliveries
      - resolve_delivery
      - hold_pending_messages
  - title: Background jobs, exports and reports
    desc: Queue analyses and exports, run the worker, download artifacts and render reports.
    contents:
      - request_analysis
      - request_export
      - request_study_export
      - get_operation
      - claim_job
      - renew_job_lease
      - worker_step
      - record_worker_heartbeat
      - download_artifact
      - prepare_report_data
      - prepare_study_report_data
      - write_report_data
      - render_study_report
      - write_participant_feedback
  - title: Audit, documentation and operations
    desc: Read the audit trail, record author-supplied documentation and inspect the state of a deployment.
    contents:
      - list_audit_events
      - record_study_documentation
      - get_study_documentation
      - get_system_status
      - get_operations_status
      - get_retention_report
      - remove_expired_artifacts
      - remove_unfinished_exports
  - title: Conditions and technical log
    desc: Structured errors and a log of fixed tokens without study content.
    contents:
      - del_abort
      - new_correlation_id
      - log_event
      - log_operation
  - title: Package
    desc: Overview of the package.
    contents:
      - delphyr-package
articles:
  - title: Guides
    desc: Worked examples that run offline with synthetic data.
    navbar: ~
    contents:
      - offline
