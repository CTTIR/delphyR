name: delphyr-auth
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    container_name: delphyr-auth-keycloak
    command: [start-dev, --import-realm, --hostname=http://127.0.0.1:4190]
    ports: ["127.0.0.1:4190:8080"]
    volumes: ["../../.local/auth/realm.json:/opt/keycloak/data/import/delphyr-realm.json:ro"]
    mem_limit: 1g
    networks:
      front: {ipv4_address: 172.30.246.4}
  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    container_name: delphyr-auth-proxy
    command: [--config=/run/auth/proxy.cfg]
    ports: ["127.0.0.1:4189:4180"]
    volumes: ["../../.local/auth/proxy.cfg:/run/auth/proxy.cfg:ro"]
    restart: on-failure
    networks:
      front: {ipv4_address: 172.30.246.2}
  gateway:
    image: nginx:stable-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: delphyr-auth-gateway
    volumes: ["../../.local/auth/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks:
      front: {ipv4_address: 172.30.246.3}
      back: {ipv4_address: 172.30.247.2}
  app:
    build: {context: ../.., dockerfile: deploy/auth/Dockerfile}
    image: delphyr-auth-app:local
    container_name: delphyr-auth-app
    volumes: ["../../.local/auth/gateway.secret:/run/delphyr-auth/gateway.secret:ro"]
    networks:
      back: {ipv4_address: 172.30.247.3}
networks:
  front:
    name: delphyr-auth-front
    internal: false
    ipam: {config: [{subnet: 172.30.246.0/24}]}
  back:
    name: delphyr-auth-back
    internal: true
    ipam: {config: [{subnet: 172.30.247.0/24}]}
